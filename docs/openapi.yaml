openapi: 3.0.3
info:
  title: Genius POS API
  version: 1.0.0
servers:
  - url: /api
paths:
  /health:
    get:
      responses: { '200': { description: OK } }
  /auth/register:
    post:
      responses: { '201': { description: Created } }
  /auth/login:
    post:
      responses: { '200': { description: OK } }
  /me:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
  /sync/push:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Synced } }
  /sync/pull:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Changed records } }
  /records/{type}:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Records } }
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Saved } }
  /records/{type}/{id}:
    delete:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Deleted } }
  /export:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Full JSON export } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
