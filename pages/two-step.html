<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genius POS — Two Step Authentication</title><link rel="stylesheet" href="../assets/styles.css"></head><body><main class="auth"><section class="auth-card"><div class="auth-brand"><div class="brand">GENIUS<span>POS</span></div><p class="muted">Optional two-step authentication</p></div><div class="notice">For user ID <b data-user-id></b>, choose whether to require a second verification step at sign in.</div><form class="form" style="margin-top:18px" onsubmit="event.preventDefault();const u=JSON.parse(localStorage.getItem('geniuspos.session')||'{}');u.twoStep=this.querySelector('input').checked;const a=JSON.parse(localStorage.getItem('geniuspos.users')||'[]');localStorage.setItem('geniuspos.users',JSON.stringify(a.map(x=>x.userId===u.userId?u:x)));localStorage.setItem('geniuspos.session',JSON.stringify(u));location.href='dashboard.html'"><label>Authentication method<select><option>Authenticator app</option><option>Email verification</option><option>SMS verification</option></select></label><label><input type="checkbox" style="width:auto"> Require two-step authentication</label><button class="btn gold">Save & Continue</button></form></section></main><script src="../assets/app.js"></script></body></html>
