<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genius POS — Checkout</title><link rel="stylesheet" href="../assets/styles.css"></head><body class="shell"><header class="topbar"><a class="brand" href="dashboard.html">GENIUS<span>POS</span></a><div class="top-actions"><a class="btn ghost" href="dashboard.html">← Dashboard</a><span class="avatar" data-user-name>G</span></div></header><main class="container"><div class="eyebrow">Intelligent checkout terminal</div><h1>New sale</h1><div class="pos-layout"><section class="page-card"><div class="search"><input id="product-search" placeholder="Search products or scan a barcode…"><button class="btn info" id="scan">📷 Scan</button></div><div class="grid" id="product-grid"></div></section><aside class="page-card cart-panel"><h2>Current sale <span class="chip" data-cart-count>0</span></h2><div id="cart"></div><div class="total-box"><div class="total-row"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div><div class="total-row"><span>Tax (8.25%)</span><strong id="tax">$0.00</strong></div><div class="total-row"><span>Discount</span><strong id="discount">-$0.00</strong></div><div class="total-row grand"><span>Total</span><strong id="total">$0.00</strong></div><div class="form-row" style="margin-top:14px"><button class="btn success" id="pay-card">Card</button><button class="btn gold" id="pay-cash">Cash</button></div><button class="btn ghost" id="hold" style="width:100%;margin-top:8px">Hold order</button><button class="btn ghost" id="receipt" style="width:100%;margin-top:8px">Preview receipt</button></div></aside></div></main><script src="../assets/app.js"></script><script>GeniusPOS.requireUser();const taxRate=.0825;function draw(){const c=GeniusPOS.getCart(),box=document.querySelector('#cart');box.innerHTML=c.length?c.map(i=>`<div class="cart-line"><div><strong>${i.name}</strong><div class="muted">${GeniusPOS.money(i.price)} each</div></div><div class="qty"><button onclick="change('${i.id}',-1)">−</button><b>${i.qty}</b><button onclick="change('${i.id}',1)">+</button></div></div>`).join(''):'<p class="muted">Your sale is empty.</p>';const sub=c.reduce((s,i)=>s+i.qty*i.price,0),tax=sub*taxRate;document.querySelector('#subtotal').textContent=GeniusPOS.money(sub);document.querySelector('#tax').textContent=GeniusPOS.money(tax);document.querySelector('#total').textContent=GeniusPOS.money(sub+tax);document.querySelector('[data-cart-count]').textContent=c.reduce((s,i)=>s+i.qty,0)}function change(id,d){let c=GeniusPOS.getCart(),i=c.find(x=>x.id===id);if(i){i.qty+=d;if(i.qty<=0)c=c.filter(x=>x.id!==id)}GeniusPOS.saveCart(c);draw()}draw();document.querySelectorAll('.add-product').forEach(b=>b.onclick=()=>{GeniusPOS.addToCart(b.dataset.id);draw()});document.querySelector('#product-search').addEventListener('input',e=>GeniusPOS.renderProducts('#product-grid',e.target.value));document.querySelector('#scan').onclick=async()=>{if(!('BarcodeDetector'in window)){GeniusPOS.toast('Barcode scanning needs a supported browser camera API.');return}GeniusPOS.toast('Camera scanner ready — connect a barcode workflow to your inventory API.')};document.querySelector('#hold').onclick=()=>{GeniusPOS.audit('sale.hold',{items:GeniusPOS.getCart()});GeniusPOS.saveCart([]);draw();GeniusPOS.toast('Order held securely for this user.')};document.querySelector('#receipt').onclick=()=>{const total=document.querySelector('#total').textContent;const w=window.open('','_blank','width=420,height=650');if(w)w.document.write(`<pre style="font:16px system-ui;padding:24px">GENIUS POS\n\nReceipt preview\nUser: ${GeniusPOS.user()?.userId||''}\nTotal: ${total}\n\nThank you.</pre>`)};document.querySelectorAll('#pay-card,#pay-cash').forEach(b=>b.onclick=()=>{const total=document.querySelector('#total').textContent;GeniusPOS.audit('sale.completed',{method:b.id==='pay-card'?'card':'cash',total});GeniusPOS.saveCart([]);draw();GeniusPOS.toast(`Sale completed — ${total}`)});</script></body></html>
